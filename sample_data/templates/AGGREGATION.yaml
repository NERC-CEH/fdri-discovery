globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: AggregationConcept
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/aggregation/{AGGREGATION_ID|slug}>"
      "@type": "<fdri:Aggregation>"
      "<skos:inScheme>": "<::AggregationConcept>"
      "^<skos:hasTopConcept>": "<::AggregationConcept>"
      "<skos:prefLabel>": "{AGGREGATION_NAME}@en"
