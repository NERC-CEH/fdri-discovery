    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/time-anchor/{ID|slug}>"
      "@type": "<fdri:ValueTimeAnchor>"
      "<skos:inScheme>": "<::ValueTimeAnchorScheme>"
      "^<skos:hasTopConcept>": "<::ValueTimeAnchorScheme>"
      "<skos:prefLabel>": "{NAME}@en"
