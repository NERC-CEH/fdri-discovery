globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

one_offs:
  - name: Nrfa
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/network/nrfa>"
      "@type": "<fdri:EnvironmentalMonitoringNetwork>"
      "<rdfs:label>": "NRFA Network@en"

  - name: NrfaProgramme
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/programme/nrfa>"
      "@type": "<fdri:EnvironmentalMonitoringProgramme>"
      "<rdfs:label>": "NRFA Programme@en"

  - name: NrfaFacilityGroupTypeScheme
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/nrfa/group-type>
      "@type": <fdri:FacilityGroupTypeScheme>
      "<dct:title>": "NRFA Monitoring Facility Group Types@en"
      "<rdfs:label>": "NRFA Monitoring Facility Group Types@en"

  - name: RiverGroupType
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/nrfa/group-type/river>
      "@type": <fdri:FacilityGroupType>
      "<rdfs:label>": "NRFA River Group@en"
      "<skos:prefLabel>": "NRFA River Group@en"
      "<skos:inScheme>": <::NrfaFacilityGroupTypeScheme>
      "^<skos:hasTopConcept>": <::NrfaFacilityGroupTypeScheme>

  - name: LocationGroupType
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/nrfa/group-type/location>
      "@type": <fdri:FacilityGroupType>
      "<rdfs:label>": "NRFA Location Group@en"
      "<skos:prefLabel>": "NRFA Location Group@en"
      "<skos:inScheme>": <::NrfaFacilityGroupTypeScheme>
      "^<skos:hasTopConcept>": <::NrfaFacilityGroupTypeScheme>

  - name: CountryGroupType
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/nrfa/group-type/country>
      "@type": <fdri:FacilityGroupType>
      "<rdfs:label>": "NRFA Country Group@en"
      "<skos:prefLabel>": "NRFA Country Group@en"
      "<skos:inScheme>": <::NrfaFacilityGroupTypeScheme>
      "^<skos:hasTopConcept>": <::NrfaFacilityGroupTypeScheme>

  - name: OperatorRole
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/common/related-party-role/operator>
      "@type": <fdri:RelatedPartyRole>
      "<skos:prefLabel>": "Operator@en"
      "<skos:scopeNote>": "The organisation or person that operates the monitoring site@en"
      "<rdfs:label>": "Operator@en"
      "<rdfs:comment>": "The organisation or person that operates the monitoring site@en"
      "<skos:inScheme>": <::CommonRelatedPartyRoleScheme>
      "^<skos:hasTopConcept>": <::CommonRelatedPartyRoleScheme>

  - name: OperatorOrganisationRole
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/common/related-party-role/operator-organisation>
      "@type": <fdri:RelatedPartyRole>
      "<rdfs:label>": "Operator Organisation@en"
      "<skos:prefLabel>": "Operator Organisation@en"
      "<rdfs:comment>": "The parent organisation of the organisation or person that operates the monitoring site@en"
      "<skos:scopeNote>": "The parent organisation of the organisation or person that operates the monitoring site@en"
      "<skos:inScheme>": <::CommonRelatedPartyRoleScheme>
      "^<skos:hasTopConcept>": <::CommonRelatedPartyRoleScheme>

resources:

  - name: MonitoredFeature
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/feature/nrfa-{NRFA_ID|slug}>
      "@type": <fdri:GeospatialFeatureOfInterest>
      "<rdfs:label>": "{NAME}@en"
      "<geos:hasGeometry>":
        - name: EastingsNorthingsPoint
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/feature/nrfa-{NRFA_ID|slug}#geo-eastings>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "<http://www.opengis.net/def/crs/EPSG/0/27700> POINT({EASTING} {NORTHING})^^<geos:wktLiteral>"
        - name: LatLongPoint
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/feature/nrfa-{NRFA_ID|slug}#geo-latlong>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "POINT({LONGITUDE} {LATITUDE})^^<geos:wktLiteral>"
      "<fdri:hasRepresentativePoint>": <::LatLongPoint>
      "<geo:lat>": "{LATITUDE|asDecimal}"
      "<geo:long>": "{LONGITUDE|asDecimal}"
      "<spatialrelations:easting>": "{EASTING|asDecimal}"
      "<spatialrelations:northing>": "{NORTHING|asDecimal}"

  - name: OperatorAgent
    requires:
      OPERATOR_ID:
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/agent/nrfa-operator-{OPERATOR_ID|slug}>
      "@type": <fdri:Agent>
      "<dct:identifier>": "{OPERATOR_ID}"

  - name: OperatorOrganisationAgent
    requires:
      ORGANISATION_ID:
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/agent/nrfa-operator-organisation-{ORGANISATION_ID|slug}>
      "@type": <fdri:Organization>
      "<rdfs:label>": "{ORGANISATION_ID}@en"
      "<foaf:member>": <::OperatorAgent>

  - name: MonitoringSite
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}>
      "@type": <fdri:EnvironmentalMonitoringSite>
      "<rdfs:label>": "{NAME}@en"
      "<rdfs:comment>": "{TEXT_GENERAL}@en"
      "<dct:identifier>":
        - "{NRFA_ID}"
      "^<doo:contains>": <::Nrfa>
      "^<doo:utilises>": <::NrfaProgramme>
      "<fdri:utilisedBy>": <::NrfaProgramme>
      "<sosa:hasFeatureOfInterest>": <::MonitoredFeature>
      "<geos:hasGeometry>":
        - name: EastingsNorthingsPoint
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#geo-eastings>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "<http://www.opengis.net/def/crs/EPSG/0/27700> POINT({EASTING} {NORTHING})^^<geos:wktLiteral>"
        - name: LatLongPoint
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#geo-latlong>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "POINT({LONGITUDE} {LATITUDE})^^<geos:wktLiteral>"
      "<fdri:hasRepresentativePoint>": <::LatLongPoint>
      "<geo:lat>": "{LATITUDE|asDecimal}"
      "<geo:long>": "{LONGITUDE|asDecimal}"
      "<spatialrelations:easting>": "{EASTING|asDecimal}"
      "<spatialrelations:northing>": "{NORTHING|asDecimal}"
      "<geo:alt>": "{ALTITUDE|asDecimal}"
      "<fdri:hasAnnotation>":
        - name: CatchmentArea
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#catchment-area>"
            "@type": "<fdri:Annotation>"
            "<fdri:property>": <http://fdri.ceh.ac.uk/ref/common/annotation-property/catchment_area_size>
            "<fdri:hasValue>":
              - name: CatchmentAreaValue
                properties:
                  "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#catchment-area.value>"
                  "@type": "<schema:PropertyValue>"
                  "<schema:value>": "{CATCHMENT_AREA | asDecimal}"
        - name: OperatorIdentifier
          requires:
            OPERATOR_STATION_ID:
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#operator-identifier>"
            "@type": "<fdri:Annotation>"
            "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/operator_facility_id>"
            "<fdri:hasValue>":
              - name: OperatorIdentifierValue
                properties:
                  "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#operator-identifier.value>"
                  "@type": "<schema:PropertyValue>"
                  "<schema:value>": "{OPERATOR_STATION_ID}"
      "<prov:qualifiedAttribution>":
        - name: OperatorAttribution
          requires:
            OPERATOR_ID:
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#operator-attribution>"
            "@type": "<fdri:RelatedPartyAttribution>"
            "<prov:agent>": <::OperatorAgent>
            "<dcat:hasRole>": <::OperatorRole>
        - name: OperatorOrganisationAttribution
          requires:
            ORGANISATION_ID:
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nrfa-{NRFA_ID|slug}#organisation-attribution>"
            "@type": "<fdri:RelatedPartyAttribution>"
            "<prov:agent>": <::OperatorOrganisationAgent>
            "<dcat:hasRole>": <::OperatorOrganisationRole>

  - name: RiverGroup
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/facility-group/nrfa-river-{RIVER|slug}>
      "@type": <fdri:FacilityGroup>
      "<rdfs:label>": "{RIVER}@en"
      "<dct:type>": <::RiverGroupType>
      "<fdri:hasMember>": <::MonitoringSite>

  - name: LocationGroup
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/facility-group/nrfa-location-{LOCATION|slug}>
      "@type": <fdri:FacilityGroup>
      "<rdfs:label>": "{LOCATION}@en"
      "<dct:type>": <::LocationGroupType>
      "<fdri:hasMember>": <::MonitoringSite>

  - name: CountryGroup
    requires:
      COUNTRY_CODE:
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/facility-group/nrfa-country-{COUNTRY_CODE|slug}>
      "@type": <fdri:FacilityGroup>
      "<rdfs:label>": "{COUNTRY_CODE}@en"
      "<dct:type>": <::CountryGroupType>
      "<fdri:hasMember>": <::MonitoringSite>

