globals:
  $baseURI: http://fdri.ceh.ac.uk/
  $datasetID: default

imports:
  - namespaces.yaml
  - extensions.py

one_offs:
  - name: Methods
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/common/method>
      "@type": <skos:ConceptScheme>
      "<dct:title>": "Data Processing Methods@en"
      "<rdfs:label>": "Data Processing Methods@en"
  - name: CorrectionMethods
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/common/method/corrections>
      "@type": <skos:Concept>
      "<skos:prefLabel>": "Correction Methods@en"
      "<rdfs:label>": "Correction Methods@en"
      "<skos:inScheme>": <::Methods>
      "^<skos:hasTopConcept>": <::Methods>

resources:
  - name: MethodCategory
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/common/method/{CATEGORY|slug}>
      "@type": <skos:Concept>
      "<skos:prefLabel>": "{CATEGORY}@en"
      "<skos:inScheme>": <::Methods>
      "<skos:broader>": <::CorrectionMethods>
      

  - name: Method
    properties:
      "@id": <http://fdri.ceh.ac.uk/ref/common/method/{METHOD_ID|slug}>
      "@type": <fdri:DataProcessingMethod>
      "<skos:notation>": "{METHOD_ID}"
      "<skos:prefLabel>": "{METHOD_NAME}@en"
      "<skos:scopeNote>": "{METHOD_DESCRIPTION}@en"
      "<skos:broader>": <::MethodCategory>
      "<skos:inScheme>": <::Methods>
