globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

one_offs:
  - name: Network
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/network/nmdb>"
      "@type": "<fdri:EnvironmentalMonitoringNetwork>"
      "<rdfs:label>": "NMDB@en"
      "<foaf:homepage>": "https://www.nmdb.eu/station/^^<xsd:anyURI>"

  - name: Programme
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/programme/nmdb>"
      "@type": "<fdri:EnvironmentalMonitoringProgramme>"
      "<rdfs:label>": "NMDB: The Neutron Monitor Database@en"
      "<foaf:homepage>": "https://www.nmdb.eu/^^<xsd:anyURI>"

resources:
  - name: Site
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/nmdb-{SITE_ID|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringSite>"
      "<rdfs:label>": "{SITE_NAME}@en"
      "<dct:identifier>": "{SITE_ID}"
      "^<doo:contains>": <::Network>
      "^<doo:utilises>": <::Programme>
      "<fdri:utilisedBy>": <::Programme>
      "<fdri:isPrivate>":
        - name: MonitoringSiteIsPrivate
          requires:
            IsPrivate: ["1", "T", "true", "True", "TRUE"]
          pattern: "true^^<xsd:boolean>"
      "<geos:hasGeometry>":
        - name: LatLongPoint
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nmdb-{SITE_ID|slug}#geo-latlong>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "POINT({LONGITUDE} {LATITUDE})^^<geos:wktLiteral>"
      "<fdri:hasRepresentativePoint>": <::LatLongPoint>
      "<geo:lat>": "{LATITUDE | asDecimal}"
      "<geo:long>": "{LONGITUDE | asDecimal}"
      "<geo:alt>": "{ALTITUDE | asDecimal}"
      "<fdri:operatingPeriod>":
        - name: OperatingPeriod
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/nmdb-{SITE_ID|slug}#operating-period>"
            "@type": "<dct:PeriodOfTime>"
            "<dcat:startDate>": "{DATE_INSTALLED | asDateOrDatetime}"
