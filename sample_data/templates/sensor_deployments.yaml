globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default

imports:
    - namespaces.yaml
    - extensions.py

resources:

  - name: Feature
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/feature/cosmos-{SITE_ID|slug}>"
      "@type": <fdri:GeospatialFeatureOfInterest>

  - name: SensorType
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/monitoring-system-type/{INSTRUMENT_ID|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringSystemType>"
      "<skos:prefLabel>": "{INSTRUMENT_ID}@en"
      "<skos:inScheme>": "<::CommonSystemTypeScheme>"
      "^<skos:hasTopConcept>": "<::CommonSystemTypeScheme>"
      "<sosa:observes>": "<http://fdri.ceh.ac.uk/ref/common/cop/{PARAMETER_ID|slug}>"

  - name: Sensor
    requires:
      INSTRUMENT_ID:
      SERIAL_NUMBER:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/system/cosmos-{INSTRUMENT_ID|slug}-{SERIAL_NUMBER|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringSensor>"
      "<rdfs:label>": "{INSTRUMENT_ID} {SERIAL_NUMBER}@en"
      "<dct:type>": "<::SensorType>"
      "<fdri:serialNumber>": "{SERIAL_NUMBER}"

  - name: SensorDeployment
    requires:
      INSTRUMENT_ID:
      SERIAL_NUMBER:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/deployment/cosmos-{SITE_ID|slug}-{COLUMN_GROUP|slug}-{INSTRUMENT_ID|slug}-{SERIAL_NUMBER|slug}-{INSTANCE|asInt}>"
      "@type": "<fdri:StaticDeployment>"
      "<rdfs:label>": "Deployment of {INSTRUMENT_ID} {SERIAL_NUMBER} to {COLUMN_GROUP} at {SITE_ID}@en"
      "<ssn:deployedSystem>": "<::Sensor>"
      "<ssn:deployedOnPlatform>": "<http://fdri.ceh.ac.uk/id/site/cosmos-{SITE_ID|slug}>"
      "<prov:startedAtTime>": "{START_DATETIME|asDateTime}"
      "<fdri:deployedHeight>": "{INSTALLATION_HEIGHT|asDecimal}"

  - name: SensorDeploymentEnd
    requires:
      INSTRUMENT_ID:
      SERIAL_NUMBER:
      END_DATETIME:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/deployment/cosmos-{SITE_ID|slug}-{COLUMN_GROUP|slug}-{INSTRUMENT_ID|slug}-{SERIAL_NUMBER|slug}-{INSTANCE|asInt}>"
      "<prov:endedAtTime>": "{END_DATETIME|asDateTime}"

  - name: SensorDeploymentComments
    requires:
      INSTRUMENT_ID:
      SERIAL_NUMBER:
      COMMENTS:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/deployment/cosmos-deployment-{SITE_ID|slug}-{INSTRUMENT_ID|slug}-{SERIAL_NUMBER|slug}-{INSTANCE|asInt}>"
      "<rdfs:comment>": "{COMMENTS}@en"
