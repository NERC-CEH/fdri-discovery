globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: ActivityRole
    requires:
      ID:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/activity-role/{ID|slug}>"
      "@type": <skos:Concept>
      "<skos:inScheme>": <::ActivityRoleScheme>
      "<skos:prefLabel>": "{Label}@en"
      "<skos:broader>": "<http://fdri.ceh.ac.uk/ref/common/activity-role/{PARENT_ID|slug}>"
      "^<skos:narrower>": "<http://fdri.ceh.ac.uk/ref/common/activity-role/{PARENT_ID|slug}>"
      "<skos:scopeNote>": "{Description}@en"

  - name: TopLevelActivityRole
    unless:
       - PARENT_ID:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/activity-role/{ID|slug}>"
      "^<skos:hasTopConcept>": <::ActivityRoleScheme>
