globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: cosmos

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: LatLongPoint
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/{Site Number|slug}#geo-latlong>"
      "@type": "<geos:Geometry>"
      "<geos:asWKT>": "POINT({Longitude}, {Latitude})^^<geos:wktLiteral>"

  - name: Site
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/{Site Number|slug}>"
      "@type": <fdri:EnvironmentalMonitoringSite>
      "<rdfs:label>": "{Site Number}: {Site Name}@en"
      "<dct:title>": "{Site Number}: {Site Name}@en"
      "<geos:hasGeometry>": <::LatLongPoint>
      "<fdri:hasRepresentativePoint>": <::LatLongPoint>
  
  - name: FeatureOfInterest
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/feature/{Site Number|slug}>"
      "@type": "<fdri:GeospatialFeatureOfInterest>"
      "<rdfs:label>": "Environment at {Site Name}@en"
      "<dct:title>": "Environment at {Site Name}@en"
      "<geos:hasGeometry>": <::LatLongPoint>
      "<fdri:hasRepresentativePoint>": <::LatLongPoint>
