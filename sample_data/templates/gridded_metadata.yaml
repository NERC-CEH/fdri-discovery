resources:
  - name: Dataset
    requires:
      $type: Dataset
    properties:
      "@id": "<{$resource}>"
      "@type": "<fdri:GriddedDataset>"
      "<dct:title>": "{title}@en"
      "<dct:description>":
        - "{summary}@en"
        - "{description}@en"
        - "{source}@en"
      "<dcat:temporalResolution>": "{temporal_resolution}^^<xsd:duration>"
      "<dct:keyword>": "{keywords|split(',')|trim()}"
      "<dct:created>": "{date_created|asDateTime}"
      "<dct:license>": "<{license}>"
      "<dct:identifier>": "{id}"
      "<fdri:processingLevel>": <http://fdri.ceh.ac.uk/ref/common/processing-level/processed>

  - name: Array
    requires:
      $type: Array
    properties:
      "@id": "<{$resource}>"
      "@type": "<fdri:Array>"
      "<rdfs:label>": "{long_name}@en"
      "<rdfs:comment>": "{comment}@en"
      "<dct:identifier>": "{standard_name}"

  - name: ObservedProperty
    requires:
      standard_name:
    properties:
      "@id": "<http://vocab.nerc.ac.uk/standard_name/{standard_name}/>"
      "@type": "<fdri:Variable>"
      "^<sosa:observedProperty>": "<{$base}>"
  
  - name: MeasuredProperty
    requires:
      standard_name:
      units:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/measure/{standard_name|slug}-{units|slug}>"
      "@type": "<fdri:Measure>"
      "<fdri:hasUnit>":
        - name: Unit
          properties:
            "@id": "<http://fdri.ceh.ac.uk/ref/common/unit/{units|slug}>"
            "@type": "<fdri:Unit>"
            "<rdfs:label>": "{units}"
      "^<fdri:measure>": "<{$base}>"

  - name: TemporalCoverage
    requires:
      temporal_coverage_start:
      temporal_coverage_end:
    properties:
      "@id": "<{$resource|append_fragment('temporalCoverage')}>"
      "@type": "<dct:PeriodOfTime>"
      "<dcat:startDate>": "{time_coverage_start|asDateTime}"
      "<dcat:endDate>": "{time_coverage_end|asDateTime}"
      "^<dct:temporal>": "<{$resource}>"

  - name: CreatorAgent
    requires:
      creator_name:
    properties:
      "@id": "<{$resource|append_fragment('creator')}>"
      "@type": "<fdri:Agent>"
      "<rdfs:label>": "{creator_name}"
      "<foaf:mbox>": "{creator_email|split(',')|trim()}"
      "^<dct:creator>": "<{$resource}>"

  - name: PublisherAgent
    requires:
      publisher_name:
    properties:
      "@id": "<{$resource|append_fragment('publisher')}>"
      "@type": "<fdri:Agent>"
      "<rdfs:label>": "{publisher_name}"
      "<foaf:mbox>": "{publisher_email|split(',')|trim()}"
      "<foaf:homepage>": "{publisher_url|split(',')|trim()}"
      "^<dct:publisher>": "<{$resource}>"

  - name: CdmDataTypeAnnotation
    requires:
      cdm_data_type:
    properties:
      "@id": "<{$resource|append_fragment('cdmDataType')}>"
      "@type": "<fdri:Annotation>"
      "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/cdm-data-type>"
      "<fdri:hasValue>":
        - name: CdmDataTypeAnnotationValue
          properties:
            "@id": "<{$resource|append_fragment('cdmDataType.value')}>"
            "@type": "<schema:PropertyValue>"
            "<schema:value>": "{cdm_data_type}"
      "^<fdri:hasAnnotation>": "<{$resource}>"

  - name: PointSpacingAnnotation
    requires:
      point_spacing:
    properties:
      "@id": "<{$resource|append_fragment('pointSpacing')}>"
      "@type": "<fdri:Annotation>"
      "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/point-spacing>"
      "<fdri:hasValue>":
        - name: PointSpacingAnnotationValue
          properties:
            "@id": "<{$resource|append_fragment('pointSpacing.value')}>"
            "@type": "<schema:PropertyValue>"
            "<schema:value>": "{point_spacing}"
      "^<fdri:hasAnnotation>": "<{$resource}>"  

  - name: SpatialResolutionAnnotation
    requires:
      spatial_resolution:
    properties:
      "@id": "<{$resource|append_fragment('spatialResolution')}>"
      "@type": "<fdri:Annotation>"
      "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/spatial-resolution>"
      "<fdri:hasValue>":
        - name: SpatialResolutionAnnotationValue
          properties:
            "@id": "<{$resource|append_fragment('spatialResolution.value')}>"
            "@type": "<schema:PropertyValue>"
            "<schema:value>": "{spatial_resolution}"
            "<schema:unit>": "<{spatial_resolution_unit}>"
  
  - name: StandardNameVocabularyAnnotation
    requires:
      standard_name_vocabulary:
    properties:
      "@id": "<{$resource|append_fragment('standardNameVocabulary')}>"
      "@type": "<fdri:Annotation>"
      "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/standard-name-vocabulary>"
      "<fdri:hasValue>":
        - name: StandardNameVocabularyAnnotationValue
          properties:
