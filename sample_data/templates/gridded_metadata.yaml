      "@type": "<fdri:Annotation>"
      "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/standard-name-url-vocabulary>"
      "<fdri:hasValue>":
        - name: StandardNameUrlVocabularyAnnotationValue
          properties:
            "@id": "<{$resource|append_fragment('standardNameUrlVocabulary.value')}>"
            "@type": "<schema:PropertyValue>"
            "<schema:value>": "{standard_name_url_vocabulary}"
      "^<fdri:hasAnnotation>": "<{$resource}>"

  - name: GeospatialFeature
    requires:
      geospatial_lat_min:
      geospatial_lat_max:
      geospatial_lon_min:
      geospatial_lon_max:
    properties:
      "@id": "<{$resource|append_fragment('geospatialFeature')}>"
      "@type": "<fdri:GeospatialFeatureOfInterest>"
      "<geos:hasBoundingBox>":
        - name: BoundingBox
          properties:
            "@id": "<{$resource|append_fragment('geospatialFeature.boundingBox')}>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "POLYGON(({geospatial_lon_min} {geospatial_lat_min}, {geospatial_lon_min} {geospatial_lat_max}, {geospatial_lon_max} {geospatial_lat_max}, {geospatial_lon_max} {geospatial_lat_min}, {geospatial_lon_min} {geospatial_lat_min}))^^<http://www.opengis.net/ont/geosparql#wktLiteral>"
      "^<sosa:hasFeatureOfInterest>": "<{$resource}>"
  
