globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: cosmos

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: Site
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/cosmos-{SITE_ID|slug}>"

  - name: WindMasterHeight
    requires:
      WINDMASTER_HEIGHT:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/cosmos-{SITE_ID|slug}#windmaster-height>"
      "@type": <fdri:Annotation>
      "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/windmaster_height>"
      "<fdri:hasValue>":
        - name: WindMasterHeightValue
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/cosmos-{SITE_ID|slug}#windmaster-height.value>"
            "@type": <schema:PropertyValue>
            "<schema:value>": "{WINDMASTER_HEIGHT|asDecimal}"
      "^<fdri:hasAnnotation>": "<::Site>"
