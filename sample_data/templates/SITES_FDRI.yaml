globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: Network
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/network/{Network|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringNetwork>"
      "<rdfs:label>": "{Network}@en"

  - name: Programme
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/programme/{Network|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringProgramme>"
      "<rdfs:label>": "FDRI Programme@en"

  - name: MonitoringSite
    requires:
      SiteID:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}>"
      "@type": <fdri:EnvironmentalMonitoringSite>
      "<rdfs:label>": "{Site_name}@en"
      "<rdfs:comment>": "{Description}@en"
      "<dct:identifier>": "{SiteID}"
      "^<doo:contains>": <::Network>
      "^<doo:utilises>": <::Programme>
      "<fdri:utilisedBy>": <::Programme>
      "<fdri:isPrivate>":
        - name: MonitoringSiteIsPrivate
          requires:
            IsPrivate: ["1", "T", "true", "True", "TRUE"]
          pattern: "true^^<xsd:boolean>"
      "<geos:hasGeometry>":
          - name: LatLongPoint
            properties:
              "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}#geo-latlong>"
              "@type": "<geos:Geometry>"
              "<geos:asWKT>": "POINT({Longitude} {Latitude})^^<geos:wktLiteral>"
      "<geo:lat>": "{Latitude|asDecimal}"
      "<geo:long>": "{Longitude|asDecimal}"
      "<fdri:operatingPeriod>":
          - name: OperatingPeriod
            properties:
              "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}#operating-period>"
              "@type": "<dct:PeriodOfTime>"
              "<dcat:startDate>": "{Date_installed | asDateOrDatetime}"
              "<dcat:endDate>": "{Date_decomissioned | asDateOrDatetime}"
      "<fdri:hasAnnotation>":
          - name: StandardInstallation
            requires:
              Standard_Installation:
            properties:
              "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}#standard-installation>"
              "@type": "<fdri:Annotation>"
              "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/site-standard-installation>"
              "<fdri:hasValue>":
                  - name: "StandardInstallationValue"
                    properties:
                      "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}#standard-installation.value>"
                      "@type": "<schema:PropertyValue>"
                      "<schema:value>": "{Standard_Installation|asBoolean}"
          - name: LandManagementClass
            requires:
              Land_management:
            properties:
              "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}#land-management-class>"
              "@type": "<fdri:Annotation>"
              "<fdri:property>": "<http://fdri.ceh.ac.uk/ref/common/annotation-property/observed-land-cover>"
              "<fdri:hasValue>":
                  - name: "LandManagementValue"
                    properties:
                      "@id": "<http://fdri.ceh.ac.uk/id/site/{Network|slug}-{SiteID|slug}#land-management.value>"
                      "@type": "<schema:PropertyValue>"
                      "<schema:value>": "{Land_management|asBoolean}"

  - name: Catchment
    requires:
      Catchment:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/facility-group/{Network|slug}-catchment-{Catchment|slug}>"
      "@type": "<fdri:FacilityGroup>"
      "<rdfs:label>": "{Catchment}@en"
      "<dct:type>": "<http://fdri.ceh.ac.uk/ref/common/facility-group-type/catchment>"
      "<fdri:hasMember>": "<::MonitoringSite>"

  - name: SiteArea
    requires:
      SiteAreaID:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/facility-group/{Network|slug}-{SiteAreaID|slug}>"
      "@type": "<fdri:FacilityGroup>"
      "<dct:identifier>": "{SiteAreaID}"
      "<rdfs:label>": "{SiteAreaID}"
      "<dct:type>": "<http://fdri.ceh.ac.uk/ref/common/facility-group-type/location>"
      "<fdri:hasMember>": "<::MonitoringSite>"

  - name: SiteType
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/platform/{Network|slug}-{SiteAreaID|slug}-{Site_type|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringPlatform>"
      "<dct:identifier>": "{Site_type}"
      "^<dct:hasPart>": <::MonitoringSite>
