globals:
  $baseURI: http://fdri.ceh.ac.uk/
  $datasetID: default

imports:
  - namespaces.yaml
  - concept_schemes.yaml

resources:
  - name: DataProcessingPlan
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/plan/{id}>"
      "@type": "<fdri:TimeSeriesPlan>"
      "^<fdri:methodology>": <http://fdri.ceh.ac.uk/id/dataset/{output|slug}>
      "<dct:hasPart>":
        - name: DataProcessingStep
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/plan/{id}#step-{$listIndex}>"
            "@type": "<fdri:TimeSeriesPlanStep>"
