globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: cosmos

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

one_offs:
  - name: FlowstickSurveyType
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/survey-type/flowstick>"
      "@type": "<fdri:ActivityType>"
      "<skos:prefLabel>": "Flowstick survey@en"
      "<skos:inScheme>": "<::ActivityTypeScheme>"
      "^<skos:hasTopConcept>": "<::ActivityTypeScheme>"
  
resources:
  - name: FeatureOfInterest
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/feature/flowstick-{Site_Name|slug}>"
      "@type": "<fdri:GeospatialFeatureOfInterest>"
      "<rdfs:label>": "{Site_Name}@en"

  - name: SensorType
    properties:
      "@id": "<http://fdri.ceh.ac.uk/ref/common/monitoring-system-type/{system_type|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringFacilityType>"
      "<skos:prefLabel>": "{system_type}@en"
      "<skos:inScheme>": "<::SensorTypeScheme>"
      "^<skos:hasTopConcept>": "<::SensorTypeScheme>"
      "<fdri:measures>":
        - <http://fdri.ceh.ac.uk/ref/common/measure/water_velocity-inst-ms-1>
        - <http://fdri.ceh.ac.uk/ref/common/measure/water_temp-inst-degc>
      "<sosa:observes>":
        - <http://fdri.ceh.ac.uk/ref/common/cop/water_velocity>
        - <http://fdri.ceh.ac.uk/ref/common/cop/water_temp>

  - name: SensorFirmwareConfiguration
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/sensor/{system_type|slug}-{serial_number|slug}#firmware>"
      "@type": "<fdri:ConfigurationValueSeries>"
      "<rdfs:label>": "Firmware configuration for {system_type} {serial_number}@en"
      "<dct:type>": "<http://fdri.ceh.ac.uk/ref/common/configuration-property/firmware-version>"
      "<fdri:hadValue>":
        - name: FirmwareVersion
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/sensor/{system_type|slug}-{serial_number|slug}#firmware-version-{datetime|slug}>"
            "@type": "<fdri:TimeBoundPropertyValue>"
            "<rdfs:label>": "Firmware version for {system_type} {serial_number}@en"
            "<schema:value>": "{version}"
            "<fdri:interval>":
              - name: FirmwareVersionPeriod
                properties:
                  "@id": "<http://fdri.ceh.ac.uk/id/sensor/{system_type|slug}-{serial_number|slug}#firmware-version-{datetime|slug}.interval>"
                  "@type": "<dct:PeriodOfTime>"
                  "<dcat:startDate>": "{stime}^^<xsd:dateTime>"
                  "<dcat:endDate>": "{datetime}^^<xsd:dateTime>"
  - name: Sensor
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/sensor/{system_type|slug}-{serial_number|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringSensor>"
      "<rdfs:label>": "{system_type} {serial_number}@en"
      "<fdri:serialNumber>": "{serial_number}"
      "<fdri:configuration>": <::SensorFirmwareConfiguration>

  - name: Survey
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/activity/flowstick-{Site_Name|slug}-{Date|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringActivity>"
      "<dct:type>": <::FlowstickSurveyType>
      "<dct:title>": "Flowstick survey at {Site_Name} on {Date}@en"
      "<rdfs:label>": "Flowstick survey at {Site_Name} on {Date}@en"
      "<sosa:hasFeatureOfInterest>": "<::FeatureOfInterest>"
      "<fdri:facilityUsage>":
        - name: SensorUsage
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/activity/flowstick-{Site_Name|slug}-{Date|slug}#sensor-{system_type|slug}-{serial_number|slug}>"
            "@type": "<fdri:FacilityUsage>"
            "<prov:entity>": "<::Sensor>"
            "<prov:hadRole>": "<http://fdri.ceh.ac.uk/ref/common/facility-usage-role/sensor>"
      "<prov:startedAtTime>": "{stime}^^<xsd:dateTime>"
      "<prov:endedAtTime>": "{datetime}^^<xsd:dateTime>"
  
  - name: SurveyDataset
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/dataset/flowstick-{Site_Name|slug}-{Date|slug}>"
      "@type": "<fdri:ObservationDataset>"
      "<dct:title>": "Flowstick survey data at {Site_Name} on {Date}@en"
      "<rdfs:label>": "Flowstick survey data at {Site_Name} on {Date}@en"
      "<dct:description>": "Data collected during a Flowstick survey at {Site_Name} on {Date}, including measurements of water depth, flow velocity, and discharge.@en"
      "<dct:spatial>": "<::FeatureOfInterest>"
      "<dct:temporal>":
        - name: SurveyDatasetTimes
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/dataset/flowstick-{Site_Name|slug}-{Date|slug}#times>"
            "@type": "<dct:PeriodOfTime>"
            "<dcat:startDate>": "{stime}^^<xsd:dateTime>"
            "<dcat:endDate>": "{datetime}^^<xsd:dateTime>"
      "<sosa:hasFeatureOfInterest>": "<::FeatureOfInterest>"
      "<fdri:originatingActivity>": "<::Survey>"
      "<fdri:measure>":
        - <http://fdri.ceh.ac.uk/ref/common/measure/water_velocity-inst-ms-1>
        - <http://fdri.ceh.ac.uk/ref/common/measure/water_temp-inst-degc>
      "<sosa:observedProperty>":
        - <http://fdri.ceh.ac.uk/ref/common/cop/water_velocity>
        - <http://fdri.ceh.ac.uk/ref/common/cop/water_temp>
      "<fdri:processingLevel>": <http://fdri.ceh.ac.uk/ref/common/processing-level/processed>
