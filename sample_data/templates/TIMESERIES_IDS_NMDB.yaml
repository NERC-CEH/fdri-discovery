globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default
    RAW_SOURCE_BUCKET: fdri-discovery-raw-data
    PROCESSED_SOURCE_BUCKET: fdri-discovery-processed-data
    NETWORK: nmdb

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: Site
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/site/nmdb-{SITE_ID|slug}>
      "@type": "<fdri:EnvironmentalMonitoringSite>"
      "<sosa:observes>": "<http://fdri.ceh.ac.uk/ref/common/cop/{PARAMETER_ID|slug}>"

  - name: TimeSeriesDataset
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/dataset/{TIMESERIES_ID|slug}>"
      "@type": "<fdri:TimeSeriesDataset>"
      "<sosa:observedProperty>": "<http://fdri.ceh.ac.uk/ref/common/cop/{PARAMETER_ID|slug}>"
      "<skos:prefLabel>": "{LABEL}@en"
      "<dct:identifier>": "{TIMESERIES_ID}"
      "<fdri:originatingSite>": "<::Site>"
      "<fdri:originatingProgramme>": "<http://fdri.ceh.ac.uk/id/programme/nmdb>"
      "<fdri:sourceBucket>":
        - name: RAW_BUCKET
          requires:
            PROCESS_LEVEL: RAW
            S3_BUCKET:
          pattern: "{RAW_SOURCE_BUCKET}"
        - name: PROCESSED_BUCKET
          requires:
            PROCESS_LEVEL: PROCESSED
            S3_BUCKET:
          pattern: "{PROCESSED_SOURCE_BUCKET}"
      "<fdri:sourceDataset>": "{S3_DATASET}"
      "<fdri:sourceColumnName>": "{COLUMN_NAME}"
      "<fdri:sourceTimeColumnName>": "{TIME_COLUMN_NAME}"
      "<fdri:measure>": "<http://fdri.ceh.ac.uk/ref/common/measure/{MEASURE_ID|slug}>"
      "<fdri:processingLevel>": "<http://fdri.ceh.ac.uk/ref/common/processing-level/{PROCESS_LEVEL|slug}>"

  - name: RawTimeSeriesDistribution
    requires:
      PROCESS_LEVEL: RAW
      S3_BUCKET:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/distribution/{TIMESERIES_ID|slug}>"
      "@type": "<dcat:Distribution>"
      "<dct:format>": "<http://fdri.ceh.ac.uk/ref/common/format/application_vnd.apache.parquet>"
      "<dct:accessURL>": "s3://{RAW_SOURCE_BUCKET}/{NETWORK}/dataset={S3_DATASET}/site={SITE_ID}/^^<xsd:anyURI>"
      "^<dcat:distribution>": "<::TimeSeriesDataset>"

  - name: ProcessedTimeSeriesDistribution
    requires:
      PROCESS_LEVEL: PROCESSED
      S3_BUCKET:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/distribution/{TIMESERIES_ID|slug}>"
      "@type": "<dcat:Distribution>"
      "<dct:format>": "<http://fdri.ceh.ac.uk/ref/common/format/application_vnd.apache.parquet>"
      "<dct:accessURL>": "s3://{PROCESSED_SOURCE_BUCKET}/{NETWORK}/dataset={S3_DATASET}/site={SITE_ID}/^^<xsd:anyURI>"
      "^<dcat:distribution>": "<::TimeSeriesDataset>"
