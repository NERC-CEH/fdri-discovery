globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: default
    RAW_SOURCE_BUCKET: fdri-discovery-raw-data
    PROCESSED_SOURCE_BUCKET: fdri-discovery-processed-data

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

resources:
  - name: Site
    properties:
      "@id": <http://fdri.ceh.ac.uk/id/site/nmdb-{SITE_ID|slug}>
      "@type": "<fdri:EnvironmentalMonitoringSite>"
      "<sosa:observes>": "<http://fdri.ceh.ac.uk/ref/common/cop/{PARAMETER_ID|slug}>"

  - name: TimeSeriesDataset
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/dataset/{TIMESERIES_ID|slug}>"
      "@type": "<fdri:TimeSeriesDataset>"
      "<dct:type>": "<http://fdri.ceh.ac.uk/ref/nmdb/time-series/{TIMESERIES_DEF|slug}>"
      "<sosa:observedProperty>": "<http://fdri.ceh.ac.uk/ref/common/cop/{PARAMETER_ID|slug}>"
      "<fdri:originatingSite>": "<::Site>"
      "<fdri:originatingProgramme>": "<http://fdri.ceh.ac.uk/id/programme/nmdb>"
      "<fdri:sourceBucket>":
        - name: RAW_BUCKET
          requires:
            PROCESS_LEVEL: RAW
            S3_BUCKET:
          pattern: "{RAW_SOURCE_BUCKET}"
        - name: PROCESSED_BUCKET
          requires:
            PROCESS_LEVEL: PROCESSED
            S3_BUCKET:
          pattern: "{PROCESSED_SOURCE_BUCKET}"
      "<fdri:sourceDataset>": "{S3_DATASET}"
      "<fdri:sourceColumnName>": "{COLUMN_NAME}"
      "<fdri:sourceTimeColumnName>": "{TIME_COLUMN_NAME}"

  - name: SensorSlot
    requires:
      SENSOR_SLOT_ID:
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/platform/nmdb-{SITE_ID|slug}-{SENSOR_SLOT_ID|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringPlatform>"
      "<dct:isPartOf>": "<::Site>"
      "^<dct:hasPart>": "<::Site>"
      "<sosa:observes>": "<http://fdri.ceh.ac.uk/ref/common/cop/{PARAMETER_ID|slug}>"
      "^<fdri:originatingFacility>": "<::TimeSeriesDataset>"

