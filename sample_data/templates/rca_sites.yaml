globals:
    $baseURI: http://fdri.ceh.ac.uk/
    $datasetID: cosmos

imports:
    - namespaces.yaml
    - concept_schemes.yaml
    - extensions.py

one_offs:
  - name: Network
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/network/rca>"
      "@type": "<fdri:EnvironmentalMonitoringNetwork>"
      "<rdfs:label>": "River Chess Association@en"

resources:
  - name: Site
    properties:
      "@id": "<http://fdri.ceh.ac.uk/id/site/rca-{Site Name|slug}>"
      "@type": "<fdri:EnvironmentalMonitoringSite>"
      "<rdfs:label>": "{Site Name}@en"
      "^<fdri:contains>": <::Network>
      "<geos:hasGeometry>":
        - name: LatLongPoint
          properties:
            "@id": "<http://fdri.ceh.ac.uk/id/site/ea-manual-{Site Name|slug}#geo-latlong>"
            "@type": "<geos:Geometry>"
            "<geos:asWKT>": "POINT({lon}, {lat})^^<geos:wktLiteral>"
      "<fdri:hasRepresentativePoint>": <::LatLongPoint>