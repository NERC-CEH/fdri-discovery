services:

  fuseki:
    image: secoresearch/fuseki
    ports:
      - "3030:3030"
    environment:
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      ENABLE_UPLOAD: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3030/$/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  loader:
    image: curlimages/curl:latest
    depends_on:
      fuseki:
        condition: service_healthy
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    entrypoint: /bin/sh
    command: -c "sed 's|localhost:3030|fuseki:3030|g' publish-local.sh | sh"
    restart: on-failure

  api:
    image: maven:3.9-amazoncorretto-21
    working_dir: /workspace
    volumes:
      - ../dri-metadata-api:/workspace
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run -DskipTests
    environment:
      SERVER_DATASOURCE_ENDPOINT: http://fuseki:3030/ds/sparql
    ports:
      - "8080:8080"
    depends_on:
      loader:
        condition: service_completed_successfully
